<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Simplified go-cart body -->
  <path d="M20 60 L80 60 L75 50 L25 50 Z" fill="#FF6F00"/>
  
  <!-- Shopping cart integrated -->
  <path d="M30 40 L35 30 L65 30 L70 40 L68 50 L32 50 Z" 
        stroke="#FF6F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Cart lines -->
  <line x1="42" y1="33" x2="40" y2="48" stroke="#FF6F00" stroke-width="2"/>
  <line x1="50" y1="32" x2="48" y2="48" stroke="#FF6F00" stroke-width="2"/>
  <line x1="58" y1="33" x2="56" y2="48" stroke="#FF6F00" stroke-width="2"/>
  
  <!-- Wheels -->
  <circle cx="35" cy="65" r="8" fill="#424242"/>
  <circle cx="35" cy="65" r="3" fill="#FF6F00"/>
  <circle cx="65" cy="65" r="8" fill="#424242"/>
  <circle cx="65" cy="65" r="3" fill="#FF6F00"/>
  
  <!-- Flames -->
  <path d="M 10 55 Q 8 45 13 40 Q 10 42 11 37 Q 13 40 15 43 Q 16 50 13 55 Z" fill="#FF6F00"/>
  <path d="M 18 58 Q 16 50 20 45 Q 18 47 19 43 Q 20 46 22 49 Q 23 55 20 58 Z" fill="#FF8F00"/>
  
  <!-- Groceries -->
  <circle cx="45" cy="38" r="3" fill="#4CAF50"/>
  <rect x="52" y="36" width="5" height="6" rx="1" fill="#FF6F00" opacity="0.8"/>
</svg>
