[pytest]
# Pytest configuration for AI Meal Planner backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Add backend directory to Python path
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail if unknown marker used)
    --strict-markers
    # Strict config (fail on warnings in config)
    --strict-config
    # Show extra test summary info
    -rfE
    # Enable colored output
    --color=yes
    # Disable warnings summary (too noisy)
    --disable-warnings

# Test markers for categorization
markers =
    # Test type markers
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database, Redis, etc.)
    smoke: Smoke tests for post-deployment validation
    e2e: End-to-end tests (full application flow)

    # Feature markers
    auth: Authentication and authorization tests
    recipes: Recipe-related tests
    meal_plans: Meal planning tests
    grocery_cart: Grocery cart and aggregation tests
    workflow: LangGraph workflow orchestration tests
    rate_limiting: Rate limiting tests
    health_check: Health check and monitoring tests

    # Performance markers
    slow: Tests that take longer than 1 second
    load: Load and performance tests

    # External dependency markers
    requires_db: Tests requiring database connection
    requires_redis: Tests requiring Redis connection
    requires_api: Tests requiring external API access
    requires_knuspr: Tests requiring Knuspr integration

    # State markers
    flaky: Tests that occasionally fail (need investigation)
    skip: Tests to skip in CI
    wip: Work in progress tests

# Coverage configuration
[coverage:run]
branch = True
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */migrations/*
    */alembic/*
    */conftest.py
    */setup.py
    */.venv/*

[coverage:report]
# Fail if coverage is below this percentage
fail_under = 80

# Show missing lines
show_missing = True

# Exclude lines from coverage
exclude_lines =
    # Standard pragma
    pragma: no cover

    # Debug-only code
    def __repr__
    def __str__

    # Abstract methods
    @abstractmethod
    @abc.abstractmethod

    # Type checking
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:

    # Defensive programming
    raise AssertionError
    raise NotImplementedError

    # Non-runnable code
    if __name__ == .__main__.:
    if __name__ == "__main__":

    # Pass statements
    pass

    # Ellipsis
    ...

# Precision for coverage percentage
precision = 2

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json

# Asyncio configuration
asyncio_mode = auto

# Timeout for tests (prevent hanging)
timeout = 300

# Show durations of slowest tests
durations = 10
durations_min = 1.0

# Log configuration
log_cli = False
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Capture configuration
capture = no  # Don't capture stdout/stderr by default

# Warning configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignore specific third-party warnings
    ignore:.*imp module.*:DeprecationWarning
    ignore:.*the imp module.*:DeprecationWarning

# Parallel execution configuration (pytest-xdist)
# Use -n auto in command line to enable

# Test collection
collect_ignore = []

# Doctest configuration
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Cache
cache_dir = .pytest_cache
