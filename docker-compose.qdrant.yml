version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      # Uncomment to enable API key authentication
      # - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-your-secret-key}
      # Uncomment to enable telemetry
      # - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Add Qdrant dashboard (if you want a separate dashboard service)
# Note: The main Qdrant service already includes a web UI at http://localhost:6333/dashboard

volumes:
  qdrant_storage:
    driver: local
