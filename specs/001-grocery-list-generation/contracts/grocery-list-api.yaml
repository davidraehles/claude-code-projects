openapi: 3.0.3
info:
  title: Grocery List Generation API
  description: |
    API endpoints for creating grocery carts from meal plans with ingredient aggregation,
    recipe/category views, and Knuspr integration.

    This specification defines the workflow endpoints for automated grocery list generation,
    including meal plan to cart conversion, cart management, and Knuspr cart integration.
  version: 1.0.0
  contact:
    name: Meal Planner API Team

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.mealplanner.com
    description: Production

tags:
  - name: workflows
    description: End-to-end workflows for grocery cart generation

paths:
  /api/v1/workflows/carts/from-meal-plan:
    post:
      tags:
        - workflows
      summary: Create grocery cart from meal plan
      description: |
        Generates a grocery cart with aggregated ingredients from a meal plan.

        **Workflow Steps:**
        1. Fetches all recipes from the specified meal plan
        2. Extracts and aggregates ingredients (combining duplicates if enabled)
        3. Scales quantities based on meal plan settings (num_people, servings)
        4. Creates a grocery cart with categorized items
        5. Returns cart with recipe source tracking for each ingredient

        **Aggregation Logic:**
        - When `aggregate_duplicates` is true, same ingredients from different recipes are combined
        - Recipe sources are preserved to enable recipe-view and category-view modes
        - Quantities are scaled based on the meal plan's number of people

        **Unmatched Ingredients:**
        - Returns list of ingredients that couldn't be processed (e.g., missing unit conversions)
      operationId: createGroceryCartFromMealPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - meal_plan_id
              properties:
                meal_plan_id:
                  type: string
                  description: Unique identifier of the meal plan to generate cart from
                  example: "mp-42abc"
                aggregate_duplicates:
                  type: boolean
                  description: |
                    Whether to combine same ingredients from different recipes.
                    If true, "tomatoes" from Recipe A and Recipe B are merged into one line item.
                    If false, they appear as separate items with recipe attribution.
                  default: true
                  example: true
            examples:
              withAggregation:
                summary: Standard cart with ingredient aggregation
                value:
                  meal_plan_id: "mp-42abc"
                  aggregate_duplicates: true
              withoutAggregation:
                summary: Cart with per-recipe ingredient breakdown
                value:
                  meal_plan_id: "mp-42abc"
                  aggregate_duplicates: false
      responses:
        '201':
          description: Cart created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - cart_id
                  - items
                  - unmatched_ingredients
                properties:
                  cart_id:
                    type: string
                    description: Unique identifier of the created grocery cart
                    example: "cart-123xyz"
                  items:
                    type: array
                    description: List of cart items with aggregated quantities
                    items:
                      $ref: '#/components/schemas/CartItem'
                  unmatched_ingredients:
                    type: array
                    description: Ingredients that couldn't be processed (e.g., missing units, invalid format)
                    items:
                      type: string
                    example: ["edible flowers", "a pinch of saffron"]
              examples:
                successResponse:
                  summary: Successful cart creation with 5 items
                  value:
                    cart_id: "cart-123xyz"
                    items:
                      - id: "item-001"
                        ingredient_name: "Tomatoes"
                        quantity: 6.0
                        unit: "pcs"
                        recipe_ids: ["recipe-1", "recipe-3"]
                        category: "Produce"
                        matched_product_id: null
                      - id: "item-002"
                        ingredient_name: "Flour"
                        quantity: 500.0
                        unit: "g"
                        recipe_ids: ["recipe-2"]
                        category: "Pantry"
                        matched_product_id: null
                    unmatched_ingredients: []
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mealPlanNotFound:
                  summary: Meal plan does not exist
                  value:
                    detail: "Meal plan with ID 'mp-42abc' not found"
                    status_code: 400
                    error_code: "MEAL_PLAN_NOT_FOUND"
                noRecipes:
                  summary: Meal plan has no recipes
                  value:
                    detail: "Meal plan 'mp-42abc' has no recipes"
                    status_code: 400
                    error_code: "EMPTY_MEAL_PLAN"
                invalidMealPlanId:
                  summary: Invalid meal plan ID format
                  value:
                    detail: "Invalid meal_plan_id format"
                    status_code: 400
                    error_code: "INVALID_INPUT"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workflows/carts/{cart_id}:
    get:
      tags:
        - workflows
      summary: Get grocery cart details
      description: |
        Retrieves complete grocery cart information including all items and metadata.

        **Use Cases:**
        - Display cart in frontend (recipe view or category view)
        - Check cart status before Knuspr sync
        - Retrieve cart history for user

        **View Modes:**
        The `view_mode` field indicates how the frontend should display items:
        - `recipe`: Group items by recipe
        - `category`: Group items by food category (Produce, Dairy, etc.)
      operationId: getGroceryCart
      security:
        - bearerAuth: []
      parameters:
        - name: cart_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the grocery cart
          example: "cart-123xyz"
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - items
                  - created_at
                  - view_mode
                properties:
                  id:
                    type: string
                    description: Unique cart identifier
                    example: "cart-123xyz"
                  items:
                    type: array
                    description: List of cart items
                    items:
                      $ref: '#/components/schemas/CartItem'
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when cart was created
                    example: "2025-12-02T14:30:00Z"
                  view_mode:
                    type: string
                    enum: [recipe, category]
                    description: Preferred display mode for frontend
                    default: recipe
                    example: "recipe"
                  meal_plan_id:
                    type: string
                    description: Source meal plan (if cart was generated from one)
                    example: "mp-42abc"
                  status:
                    type: string
                    enum: [draft, ready, synced]
                    description: Cart status
                    example: "ready"
                  knuspr_cart_url:
                    type: string
                    format: uri
                    nullable: true
                    description: Link to Knuspr cart (if synced)
                    example: "https://knuspr.de/cart/abc123"
              examples:
                recipeViewMode:
                  summary: Cart in recipe view mode
                  value:
                    id: "cart-123xyz"
                    items:
                      - id: "item-001"
                        ingredient_name: "Tomatoes"
                        quantity: 6.0
                        unit: "pcs"
                        recipe_ids: ["recipe-1", "recipe-3"]
                        category: "Produce"
                        matched_product_id: null
                    created_at: "2025-12-02T14:30:00Z"
                    view_mode: "recipe"
                    meal_plan_id: "mp-42abc"
                    status: "ready"
                    knuspr_cart_url: null
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: "Cart with ID 'cart-123xyz' not found"
                status_code: 404
                error_code: "CART_NOT_FOUND"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workflows/carts/{cart_id}/fill-knuspr:
    post:
      tags:
        - workflows
      summary: Fill Knuspr cart with grocery items
      description: |
        Syncs the grocery cart to Knuspr by matching ingredients to products and adding them to the user's Knuspr cart.

        **Workflow Steps:**
        1. Authenticates with Knuspr using provided credentials
        2. Matches each cart item to Knuspr products (via product search API)
        3. Adds matched products to Knuspr cart
        4. Returns match statistics and list of unmatched items

        **Matching Logic:**
        - Uses fuzzy matching for ingredient names
        - Prioritizes exact matches, falls back to closest alternatives
        - Respects quantity and unit conversions

        **Security:**
        - Credentials are used only for this request and not stored
        - Knuspr session tokens are short-lived
        - Credentials are transmitted over HTTPS only

        **Progress Tracking:**
        - Returns progress percentage (0-100)
        - Use WebSocket or polling for real-time updates on long operations
      operationId: fillKnusprCart
      security:
        - bearerAuth: []
      parameters:
        - name: cart_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the grocery cart to sync
          example: "cart-123xyz"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credentials
              properties:
                credentials:
                  $ref: '#/components/schemas/KnusprCredentials'
                match_preferences:
                  type: object
                  description: Optional preferences for product matching
                  properties:
                    prefer_organic:
                      type: boolean
                      description: Prefer organic products when available
                      default: false
                    max_price_per_item:
                      type: number
                      format: float
                      description: Maximum price per item in EUR (null = no limit)
                      nullable: true
                      example: 10.0
            examples:
              basicSync:
                summary: Basic Knuspr sync with credentials
                value:
                  credentials:
                    email: "user@example.com"
                    password: "securePassword123"
              withPreferences:
                summary: Sync with organic preference
                value:
                  credentials:
                    email: "user@example.com"
                    password: "securePassword123"
                  match_preferences:
                    prefer_organic: true
                    max_price_per_item: 15.0
      responses:
        '200':
          description: Knuspr cart filled successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - matched_items
                  - unmatched_items
                  - progress
                properties:
                  success:
                    type: boolean
                    description: Overall success status
                    example: true
                  matched_items:
                    type: integer
                    description: Number of items successfully matched and added to Knuspr cart
                    example: 18
                  unmatched_items:
                    type: array
                    description: Ingredients that couldn't be matched to Knuspr products
                    items:
                      type: string
                    example: ["edible flowers", "saffron threads"]
                  progress:
                    type: number
                    format: float
                    description: Completion percentage (0-100)
                    minimum: 0
                    maximum: 100
                    example: 90.0
                  knuspr_cart_url:
                    type: string
                    format: uri
                    description: Direct link to the Knuspr cart
                    example: "https://knuspr.de/cart/abc123"
                  total_price:
                    type: number
                    format: float
                    description: Total price of matched items in EUR
                    example: 48.50
              examples:
                fullSuccess:
                  summary: All items matched successfully
                  value:
                    success: true
                    matched_items: 20
                    unmatched_items: []
                    progress: 100.0
                    knuspr_cart_url: "https://knuspr.de/cart/abc123"
                    total_price: 52.30
                partialSuccess:
                  summary: Most items matched, some unavailable
                  value:
                    success: true
                    matched_items: 18
                    unmatched_items: ["edible flowers", "saffron threads"]
                    progress: 90.0
                    knuspr_cart_url: "https://knuspr.de/cart/abc123"
                    total_price: 48.50
        '400':
          description: Invalid request or cart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emptyCart:
                  summary: Cart has no items
                  value:
                    detail: "Cart 'cart-123xyz' has no items to sync"
                    status_code: 400
                    error_code: "EMPTY_CART"
                invalidCredentials:
                  summary: Invalid Knuspr credentials
                  value:
                    detail: "Invalid Knuspr credentials provided"
                    status_code: 400
                    error_code: "INVALID_CREDENTIALS"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: "Cart with ID 'cart-123xyz' not found"
                status_code: 404
                error_code: "CART_NOT_FOUND"
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from the authentication endpoint.
        Include in Authorization header as: `Bearer <token>`

  schemas:
    CartItem:
      type: object
      required:
        - id
        - ingredient_name
        - quantity
        - unit
        - recipe_ids
        - category
      properties:
        id:
          type: string
          description: Unique identifier for this cart item
          example: "item-001"
        ingredient_name:
          type: string
          description: Name of the ingredient
          example: "Tomatoes"
          minLength: 1
          maxLength: 200
        quantity:
          type: number
          format: float
          description: Quantity of the ingredient
          example: 6.0
          minimum: 0
          exclusiveMinimum: true
        unit:
          type: string
          description: Unit of measurement
          enum: [ml, g, kg, l, pcs, cup, tbsp, tsp, oz, lb, qt, gal]
          example: "pcs"
        recipe_ids:
          type: array
          description: IDs of recipes that use this ingredient
          items:
            type: string
          minItems: 1
          example: ["recipe-1", "recipe-3"]
        category:
          type: string
          description: Food category for organization
          enum:
            - Produce
            - Dairy
            - Meat
            - Seafood
            - Bakery
            - Pantry
            - Frozen
            - Beverages
            - Snacks
            - Condiments
            - Spices
            - Other
          example: "Produce"
        matched_product_id:
          type: string
          nullable: true
          description: Knuspr product ID if matched (null before Knuspr sync)
          example: "knuspr-prod-12345"
        estimated_price:
          type: number
          format: float
          nullable: true
          description: Estimated price in EUR (if Knuspr product matched)
          example: 3.50
        notes:
          type: string
          nullable: true
          description: Additional notes or special instructions
          example: "Organic preferred"
          maxLength: 500

    KnusprCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Knuspr account email
          example: "user@example.com"
          minLength: 5
          maxLength: 255
        password:
          type: string
          format: password
          description: Knuspr account password
          example: "securePassword123"
          minLength: 8
          maxLength: 128
      description: |
        Credentials for Knuspr authentication.
        **Security Note:** These credentials are used only for this request and are not stored.
        Always transmitted over HTTPS.

    Error:
      type: object
      required:
        - detail
        - status_code
      properties:
        detail:
          type: string
          description: Human-readable error message
          example: "Meal plan with ID 'mp-42abc' not found"
        status_code:
          type: integer
          description: HTTP status code
          example: 400
        error_code:
          type: string
          description: Machine-readable error code for client handling
          example: "MEAL_PLAN_NOT_FOUND"
        field_errors:
          type: object
          nullable: true
          description: Field-specific validation errors (for 400 Bad Request)
          additionalProperties:
            type: array
            items:
              type: string
          example:
            meal_plan_id: ["Invalid UUID format"]
            aggregate_duplicates: ["Must be a boolean value"]

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: No authentication token provided
              value:
                detail: "Not authenticated. Please provide a valid JWT token."
                status_code: 401
                error_code: "MISSING_TOKEN"
            invalidToken:
              summary: Invalid or expired token
              value:
                detail: "Invalid or expired authentication token"
                status_code: 401
                error_code: "INVALID_TOKEN"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            generic:
              summary: Generic server error
              value:
                detail: "An internal server error occurred. Please try again later."
                status_code: 500
                error_code: "INTERNAL_ERROR"
            knusprTimeout:
              summary: Knuspr service timeout
              value:
                detail: "Knuspr service is unavailable. Please try again later."
                status_code: 500
                error_code: "KNUSPR_TIMEOUT"
