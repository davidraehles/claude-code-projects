name: Coverage Report

on:
  push:
    branches: [ claude/main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/coverage-report.yml'
  pull_request:
    branches: [ claude/main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  BACKEND_COVERAGE_THRESHOLD: 80
  FRONTEND_COVERAGE_THRESHOLD: 75
  COVERAGE_DECREASE_THRESHOLD: 2

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_recipe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    outputs:
      coverage_percentage: ${{ steps.coverage.outputs.percentage }}
      coverage_status: ${{ steps.coverage.outputs.status }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for coverage comparison

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-xdist coverage[toml]

    - name: Run all tests with coverage
      run: |
        pytest tests/ -v \
          -n auto \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-report=json \
          --cov-branch
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_recipe_app
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_recipe_app
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
        APP_ENV: testing
        SECRET_KEY: test-secret-key
        JWT_SECRET_KEY: test-jwt-secret

    - name: Extract coverage percentage
      id: coverage
      run: |
        COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "## Backend Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

        if (( $(echo "$COVERAGE >= ${{ env.BACKEND_COVERAGE_THRESHOLD }}" | bc -l) )); then
          echo "status=pass" >> $GITHUB_OUTPUT
          echo "✅ Coverage meets threshold (${{ env.BACKEND_COVERAGE_THRESHOLD }}%)" >> $GITHUB_STEP_SUMMARY
        else
          echo "status=warn" >> $GITHUB_OUTPUT
          echo "⚠️ Coverage below threshold (${{ env.BACKEND_COVERAGE_THRESHOLD }}%) - continuing" >> $GITHUB_STEP_SUMMARY
        fi
        fi

    - name: Generate coverage badge
      uses: tj-actions/coverage-badge-py@v2
      with:
        working-directory: backend
        output: coverage-badge.svg

    - name: Upload coverage badge
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-badge
        path: backend/coverage-badge.svg
        retention-days: 30

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-reports
        path: |
          backend/coverage.xml
          backend/coverage.json
          backend/htmlcov/
        retention-days: 30

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: true
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Generate coverage diff
      if: github.event_name == 'pull_request'
      run: |
        # Get coverage from base branch
        git checkout ${{ github.event.pull_request.base.sha }}
        pytest tests/ -v --cov=app --cov-report=json:coverage-base.json 2>/dev/null || echo "0" > coverage-base.json

        # Compare coverages
        python - <<EOF
        import json
        import sys

        try:
            with open('coverage.json') as f:
                current = json.load(f)['totals']['percent_covered']
        except:
            current = 0

        try:
            with open('coverage-base.json') as f:
                base_data = json.load(f)
                base = base_data.get('totals', {}).get('percent_covered', 0)
        except:
            base = 0

        diff = current - base
        print(f"Current: {current:.2f}%")
        print(f"Base: {base:.2f}%")
        print(f"Diff: {diff:+.2f}%")

        # Write to step summary
        with open('$GITHUB_STEP_SUMMARY', 'a') as f:
            f.write(f"\n## Coverage Comparison\n")
            f.write(f"- **Current Coverage:** {current:.2f}%\n")
            f.write(f"- **Base Coverage:** {base:.2f}%\n")
            f.write(f"- **Difference:** {diff:+.2f}%\n\n")

            if diff < -${{ env.COVERAGE_DECREASE_THRESHOLD }}:
                f.write(f"❌ Coverage decreased by more than ${{ env.COVERAGE_DECREASE_THRESHOLD }}%\n")
                sys.exit(1)
            elif diff < 0:
                f.write(f"⚠️ Coverage decreased slightly\n")
            else:
                f.write(f"✅ Coverage maintained or improved\n")
        EOF
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_recipe_app
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: test_recipe_app
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        APP_ENV: testing

    - name: Generate uncovered files report
      run: |
        python - <<EOF
        import json

        with open('coverage.json') as f:
            data = json.load(f)

        # Find files with low coverage
        low_coverage = []
        for file, metrics in data['files'].items():
            coverage = metrics['summary']['percent_covered']
            if coverage < 80:
                low_coverage.append((file, coverage))

        # Sort by coverage ascending
        low_coverage.sort(key=lambda x: x[1])

        with open('$GITHUB_STEP_SUMMARY', 'a') as f:
            if low_coverage:
                f.write(f"\n## Files Below 80% Coverage\n\n")
                f.write(f"| File | Coverage |\n")
                f.write(f"|------|----------|\n")
                for file, coverage in low_coverage[:20]:  # Top 20
                    f.write(f"| {file} | {coverage:.1f}% |\n")
            else:
                f.write(f"\n✅ All files meet 80% coverage threshold\n")
        EOF

  frontend-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    outputs:
      coverage_percentage: ${{ steps.coverage.outputs.percentage }}
      coverage_status: ${{ steps.coverage.outputs.status }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm test -- --coverage --coverageReporters=json --coverageReporters=html --coverageReporters=text --coverageReporters=lcov
      env:
        CI: true

    - name: Extract coverage percentage
      id: coverage
      run: |
        COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "## Frontend Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

        if (( $(echo "$COVERAGE >= ${{ env.FRONTEND_COVERAGE_THRESHOLD }}" | bc -l) )); then
          echo "status=pass" >> $GITHUB_OUTPUT
          echo "✅ Coverage meets threshold (${{ env.FRONTEND_COVERAGE_THRESHOLD }}%)" >> $GITHUB_STEP_SUMMARY
        else
          echo "status=warn" >> $GITHUB_OUTPUT
          echo "⚠️ Coverage below threshold (${{ env.FRONTEND_COVERAGE_THRESHOLD }}%) - continuing" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Generate coverage badge
      run: |
        npm install -g badge-maker
        COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
        COLOR=$(node -e "
          const cov = require('./coverage/coverage-summary.json').total.lines.pct;
          if (cov >= 90) console.log('brightgreen');
          else if (cov >= 80) console.log('green');
          else if (cov >= 70) console.log('yellowgreen');
          else if (cov >= 60) console.log('yellow');
          else console.log('red');
        ")
        badge "coverage" "${COVERAGE}%" "$COLOR" > coverage-badge.svg

    - name: Upload coverage badge
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-badge
        path: frontend/coverage-badge.svg
        retention-days: 30

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-reports
        path: |
          frontend/coverage/
        retention-days: 30

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: true
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Generate coverage diff
      if: github.event_name == 'pull_request'
      run: |
        # Get coverage from base branch
        git checkout ${{ github.event.pull_request.base.sha }}
        npm ci
        npm test -- --coverage --coverageReporters=json 2>/dev/null || echo '{"total":{"lines":{"pct":0}}}' > coverage/coverage-summary.json

        # Compare coverages
        node - <<'EOF'
        const fs = require('fs');
        const current = require('./coverage/coverage-summary.json').total.lines.pct;

        let base = 0;
        try {
          base = require('./coverage/coverage-summary.json').total.lines.pct;
        } catch (e) {
          base = 0;
        }

        const diff = current - base;
        console.log(`Current: ${current.toFixed(2)}%`);
        console.log(`Base: ${base.toFixed(2)}%`);
        console.log(`Diff: ${diff > 0 ? '+' : ''}${diff.toFixed(2)}%`);

        // Write to step summary
        let summary = `\n## Coverage Comparison\n`;
        summary += `- **Current Coverage:** ${current.toFixed(2)}%\n`;
        summary += `- **Base Coverage:** ${base.toFixed(2)}%\n`;
        summary += `- **Difference:** ${diff > 0 ? '+' : ''}${diff.toFixed(2)}%\n\n`;

        if (diff < -${{ env.COVERAGE_DECREASE_THRESHOLD }}) {
          summary += `❌ Coverage decreased by more than ${{ env.COVERAGE_DECREASE_THRESHOLD }}%\n`;
          process.exit(1);
        } else if (diff < 0) {
          summary += `⚠️ Coverage decreased slightly\n`;
        } else {
          summary += `✅ Coverage maintained or improved\n`;
        }

        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
        EOF

  aggregate-coverage:
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]
    if: always()
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download backend coverage
      uses: actions/download-artifact@v4
      with:
        name: backend-coverage-reports
        path: backend-coverage

    - name: Download frontend coverage
      uses: actions/download-artifact@v4
      with:
        name: frontend-coverage-reports
        path: frontend-coverage

    - name: Calculate aggregate coverage
      id: aggregate
      run: |
        # Calculate weighted average (backend has more code typically)
        BACKEND_COV=${{ needs.backend-coverage.outputs.coverage_percentage }}
        FRONTEND_COV=${{ needs.frontend-coverage.outputs.coverage_percentage }}

        # Weighted average (60% backend, 40% frontend)
        TOTAL=$(echo "scale=2; ($BACKEND_COV * 0.6) + ($FRONTEND_COV * 0.4)" | bc)

        echo "total_coverage=$TOTAL" >> $GITHUB_OUTPUT

        echo "## Project Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Coverage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend | ${BACKEND_COV}% | ${{ needs.backend-coverage.outputs.coverage_status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend | ${FRONTEND_COV}% | ${{ needs.frontend-coverage.outputs.coverage_status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Total (Weighted)** | **${TOTAL}%** | - |" >> $GITHUB_STEP_SUMMARY

    - name: Generate combined badge
      run: |
        pip install badge-maker || echo "Badge generation skipped"
        TOTAL=${{ steps.aggregate.outputs.total_coverage }}
        echo "Total project coverage: ${TOTAL}%"

    - name: Update README badges
      if: github.ref == 'refs/heads/claude/main' && github.event_name == 'push'
      run: |
        echo "Would update README.md badges here with latest coverage"
        echo "Backend: ${{ needs.backend-coverage.outputs.coverage_percentage }}%"
        echo "Frontend: ${{ needs.frontend-coverage.outputs.coverage_percentage }}%"
        echo "Total: ${{ steps.aggregate.outputs.total_coverage }}%"

    - name: Comment on PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const backendCov = '${{ needs.backend-coverage.outputs.coverage_percentage }}';
          const frontendCov = '${{ needs.frontend-coverage.outputs.coverage_percentage }}';
          const totalCov = '${{ steps.aggregate.outputs.total_coverage }}';
          const backendStatus = '${{ needs.backend-coverage.outputs.coverage_status }}';
          const frontendStatus = '${{ needs.frontend-coverage.outputs.coverage_status }}';

          const statusEmoji = (status) => status === 'pass' ? '✅' : '❌';

          let body = `## 📊 Coverage Report\n\n`;
          body += `| Component | Coverage | Status |\n`;
          body += `|-----------|----------|--------|\n`;
          body += `| Backend | ${backendCov}% | ${statusEmoji(backendStatus)} |\n`;
          body += `| Frontend | ${frontendCov}% | ${statusEmoji(frontendStatus)} |\n`;
          body += `| **Total** | **${totalCov}%** | - |\n\n`;
          body += `**Thresholds:**\n`;
          body += `- Backend: ${{ env.BACKEND_COVERAGE_THRESHOLD }}%\n`;
          body += `- Frontend: ${{ env.FRONTEND_COVERAGE_THRESHOLD }}%\n`;
          body += `- Max decrease: ${{ env.COVERAGE_DECREASE_THRESHOLD }}%\n\n`;
          body += `[View full coverage report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;

          // Find existing coverage comment
          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const coverageComment = comments.data.find(comment =>
            comment.user.type === 'Bot' && comment.body.includes('Coverage Report')
          );

          if (coverageComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: coverageComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

  coverage-enforcement:
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]
    if: always()
    timeout-minutes: 5

    steps:
    - name: Enforce coverage thresholds
      run: |
        BACKEND_STATUS="${{ needs.backend-coverage.outputs.coverage_status }}"
        FRONTEND_STATUS="${{ needs.frontend-coverage.outputs.coverage_status }}"

        echo "Backend coverage: ${{ needs.backend-coverage.outputs.coverage_percentage }}% (status: $BACKEND_STATUS)"
        echo "Frontend coverage: ${{ needs.frontend-coverage.outputs.coverage_percentage }}% (status: $FRONTEND_STATUS)"

        if [ "$BACKEND_STATUS" = "fail" ] || [ "$FRONTEND_STATUS" = "fail" ]; then
          echo "❌ Coverage enforcement failed"
          echo ""
          echo "Required thresholds:"
          echo "- Backend: ${{ env.BACKEND_COVERAGE_THRESHOLD }}%"
          echo "- Frontend: ${{ env.FRONTEND_COVERAGE_THRESHOLD }}%"
          exit 1
        fi

        echo "✅ Coverage check passed (warnings allowed)"

        echo "✅ All coverage thresholds met"

    - name: Check coverage trend
      run: |
        echo "## Coverage Trend" >> $GITHUB_STEP_SUMMARY
        echo "Historical coverage tracking would be displayed here" >> $GITHUB_STEP_SUMMARY
        echo "This would show weekly/monthly trends from stored metrics" >> $GITHUB_STEP_SUMMARY
