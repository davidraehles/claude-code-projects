name: Playwright Tests
on:
  push:
    branches: [ main, master, claude/main ]
  pull_request:
    branches: [ main, master, claude/main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Start backend services
      run: |
        docker build -t meal-planner-backend backend/
        docker run -d --name backend-test \
          -p 8000:8000 \
          -e DB_USER=postgres \
          -e DB_PASSWORD=postgres \
          -e DB_HOST=host.docker.internal \
          -e DB_PORT=5432 \
          -e DB_NAME=recipe_app \
          -e APP_ENV=test \
          -e SECRET_KEY=test-secret-key \
          -e CORS_ORIGINS=http://localhost:3000 \
          -e ENABLE_RATE_LIMITING=false \
          meal-planner-backend &
        # Wait for backend to be ready
        timeout 60 bash -c 'until curl -f http://localhost:8000/health/ready; do sleep 1; done'
    
    - name: Run Alembic migrations
      run: |
        docker exec backend-test alembic upgrade head
    
    - name: Seed test data
      run: |
        docker exec backend-test python backend/scripts/seed_test_user.py
        docker exec backend-test python backend/scripts/seed_test_data.py
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Run Playwright tests
      working-directory: frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        FRONTEND_URL: http://localhost:3000
      run: npx playwright test
    
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
    
    - name: Cleanup
      if: always()
      run: docker stop backend-test || true && docker rm backend-test || true
