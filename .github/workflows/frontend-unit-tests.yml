name: Frontend Unit Tests

on:
  push:
    branches: [ claude/main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-unit-tests.yml'
  pull_request:
    branches: [ claude/main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-unit-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests with coverage
      run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary
      env:
        CI: true

    - name: Check coverage threshold
      run: |
        # Extract coverage percentage from coverage-summary.json
        COVERAGE=$(node -pe "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.lines.pct")
        echo "Code coverage: $COVERAGE%"

        # Fail if below 75%
        if (( $(echo "$COVERAGE < 75" | bc -l) )); then
          echo "Error: Coverage $COVERAGE% is below the required 75% threshold"
          exit 1
        fi

    - name: Upload coverage reports to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        files: frontend/coverage/lcov.info
        flags: frontend,unit
        name: frontend-unit-tests
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifact
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: frontend/coverage/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results-node${{ matrix.node-version }}
        path: |
          frontend/coverage/
          frontend/junit.xml
        retention-days: 7
