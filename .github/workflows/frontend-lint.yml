name: Frontend Linting

on:
  push:
    branches: [ claude/main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-lint.yml'
  pull_request:
    branches: [ claude/main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false

    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: false

    - name: Run TypeScript type checking
      run: npx tsc --noEmit
      continue-on-error: false

    - name: Generate lint report
      if: failure()
      run: |
        npm run lint -- --format json --output-file eslint-report.json || true
        echo "## Linting Failed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "ESLint found errors that must be fixed before merging." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Run \`npm run lint\` locally to see detailed errors." >> $GITHUB_STEP_SUMMARY

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-lint-report
        path: |
          frontend/eslint-report.json
        retention-days: 7

    - name: Comment PR with lint results
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'frontend/eslint-report.json';

          let comment = '## Frontend Linting Failed\n\n';
          comment += 'Please fix the linting errors before merging.\n\n';
          comment += '**Steps to fix:**\n';
          comment += '1. Run `cd frontend && npm run lint` locally\n';
          comment += '2. Fix all errors and warnings\n';
          comment += '3. Commit and push your changes\n\n';

          if (fs.existsSync(reportPath)) {
            try {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const errorCount = report.reduce((sum, file) => sum + file.errorCount, 0);
              const warningCount = report.reduce((sum, file) => sum + file.warningCount, 0);

              comment += `**Summary:**\n`;
              comment += `- Errors: ${errorCount}\n`;
              comment += `- Warnings: ${warningCount}\n`;
            } catch (e) {
              console.log('Could not parse lint report:', e);
            }
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
