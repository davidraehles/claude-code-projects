server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Extract image name
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'

      # Extract log path
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

      # Add environment label (from docker label)
      - source_labels: ['__meta_docker_container_label_environment']
        target_label: 'environment'
        replacement: '${1:-development}'

      # Add service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Add project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            user_id: user_id
            status_code: status_code
            method: method
            path: path
            duration: duration

      # Extract timestamp if available
      - timestamp:
          source: timestamp
          format: RFC3339

      # Add labels from parsed JSON
      - labels:
          level:
          logger:
          request_id:

      # Output format
      - output:
          source: message

  # Scrape API container logs specifically
  - job_name: api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['recipe-api']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      - replacement: 'api'
        target_label: 'service'
      - replacement: 'production'
        target_label: 'environment'

    pipeline_stages:
      # Parse Python/FastAPI logs (JSON format)
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            user_id: user_id
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms
            error: error
            stack_trace: stack_trace

      - timestamp:
          source: timestamp
          format: RFC3339

      - labels:
          level:
          logger:
          method:
          status_code:

      - output:
          source: message

  # Scrape database logs
  - job_name: postgres
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['recipe-postgres']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'postgres'
        target_label: 'service'

    pipeline_stages:
      # Parse PostgreSQL logs
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+) \[(?P<pid>\d+)\] (?P<level>\w+):  (?P<message>.*)$'

      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000 MST'

      - labels:
          level:
          pid:

  # Scrape Redis logs
  - job_name: redis
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['recipe-redis']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'redis'
        target_label: 'service'

    pipeline_stages:
      # Parse Redis logs
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>\w) (?P<timestamp>\d{2} \w+ \d{4} \d{2}:\d{2}:\d{2}\.\d+) (?P<level>[*#-\.]) (?P<message>.*)$'

      - labels:
          level:
          role:
