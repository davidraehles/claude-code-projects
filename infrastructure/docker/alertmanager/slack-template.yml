<!-- Deployment Template -->
{{ define "slack.deployment.text" }}
:rocket: *Deployment Notification*

*Service:* {{ .GroupLabels.service }}
*Environment:* {{ .GroupLabels.environment | default "production" }}
*Status:* {{ if .Alerts.Firing }}In Progress / Issue Detected{{ else }}Completed Successfully{{ end }}

{{ if .Alerts.Firing }}
:warning: *Issues Detected:*
{{ range .Alerts.Firing }}
  • {{ .Annotations.description }}
{{ end }}

*Health Checks:*
{{ range .Alerts.Firing }}
  • {{ .Labels.health_check | default "Unknown" }}: {{ .Annotations.health_status | default "FAILED" }}
{{ end }}

*Action Required:*
1. Verify deployment logs
2. Check service health endpoints
3. Review rollback procedures if needed
{{ else }}
:white_check_mark: *Deployment Successful*

*Details:*
{{ range .Alerts.Resolved }}
  • {{ .Annotations.summary }}
  • Version: {{ .Labels.version | default "N/A" }}
  • Duration: {{ sub .EndsAt.Unix .StartsAt.Unix | humanizeDuration }}
{{ end }}

*Post-Deployment Checks:*
• All health checks: :white_check_mark: Passed
• Error rate: Within normal range
• Latency: Within SLA
{{ end }}

*Monitoring:*
• Dashboard: {{ template "__grafana_url" . }}/d/api-health-v1
• Logs: {{ template "__loki_url" . }}

