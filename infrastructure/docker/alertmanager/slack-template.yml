*Status:* {{ if .Alerts.Firing }}Threshold Exceeded{{ else }}Back to Normal{{ end }}

{{ if .Alerts.Firing }}
*Current Values:*
{{ range .Alerts.Firing }}
  • {{ .Annotations.summary }}
  • Value: {{ .Annotations.current_value | default "N/A" }}
  • Threshold: {{ .Annotations.threshold | default "N/A" }}
{{ end }}

*Business Impact:*
{{ range .Alerts.Firing }}
  • {{ .Annotations.impact | default "Potential impact on business KPIs" }}
{{ end }}
{{ end }}

{{ if .Alerts.Resolved }}
*Resolved:*
