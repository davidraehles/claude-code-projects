{{ define "__alertmanager_url" }}{{ .ExternalURL }}{{ end }}
{{ define "__grafana_url" }}http://localhost:3000{{ end }}
{{ define "__loki_url" }}http://localhost:3000/explore{{ end }}

{{ define "__alert_severity_emoji" -}}
  {{- if eq .Labels.severity "critical" -}}
    :red_circle:
  {{- else if eq .Labels.severity "high" -}}
    :large_orange_diamond:
  {{- else if eq .Labels.severity "medium" -}}
    :warning:
  {{- else if eq .Labels.severity "low" -}}
    :information_source:
  {{- else -}}
    :bell:
  {{- end -}}
{{- end }}

{{ define "__alert_status_emoji" -}}
  {{- if eq .Status "firing" -}}
    :fire:
  {{- else if eq .Status "resolved" -}}
    :white_check_mark:
  {{- else -}}
    :question:
  {{- end -}}
{{- end }}

{{ define "__alert_severity_color" -}}
  {{- if eq .Labels.severity "critical" -}}
    danger
  {{- else if eq .Labels.severity "high" -}}
    warning
  {{- else if eq .Labels.severity "medium" -}}
    warning
  {{- else if eq .Labels.severity "low" -}}
    good
  {{- else -}}
    #439FE0
  {{- end -}}
{{- end }}

<!-- Critical Alert Template -->
{{ define "slack.critical.text" }}
{{ template "__alert_severity_emoji" . }} *CRITICAL ALERT FIRING* {{ template "__alert_status_emoji" . }}

*Service:* {{ .GroupLabels.service }}
*Alert:* {{ .GroupLabels.alertname }}
*Severity:* {{ .GroupLabels.severity | toUpper }}
*Firing Alerts:* {{ .Alerts.Firing | len }}

*Description:*
{{ range .Alerts.Firing }}
  • {{ .Annotations.description }}
{{ end }}

*Affected Endpoints:*
{{ range .Alerts.Firing }}
  • {{ .Labels.endpoint | default "N/A" }}
{{ end }}

*Impact:*
{{ range .Alerts.Firing }}
  • {{ .Annotations.impact | default "Service degradation or outage" }}
{{ end }}

*Runbook:* {{ .CommonAnnotations.runbook_url | default "https://github.com/your-org/runbooks" }}
*Metrics Dashboard:* {{ template "__grafana_url" . }}/d/api-health-v1
*Logs:* {{ template "__loki_url" . }}

*Action Required:* @on-call - Immediate attention required!

---
*Prometheus Alert:* {{ template "__alertmanager_url" . }}
{{ end }}

<!-- Incident Alert Template -->
{{ define "slack.incident.text" }}
{{ template "__alert_severity_emoji" . }} *HIGH SEVERITY INCIDENT* {{ template "__alert_status_emoji" . }}

*Service:* {{ .GroupLabels.service }}
*Alert:* {{ .GroupLabels.alertname }}
*Severity:* {{ .GroupLabels.severity | toUpper }}
*Status:* {{ if .Alerts.Firing }}FIRING{{ else }}RESOLVED{{ end }}

*Summary:*
{{ .CommonAnnotations.summary | default "High severity issue detected" }}

{{ if .Alerts.Firing }}
*Firing Alerts ({{ .Alerts.Firing | len }}):*
{{ range .Alerts.Firing }}
  • *{{ .Labels.alertname }}* - {{ .Annotations.description }}
    Started: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
{{ end }}
{{ end }}

{{ if .Alerts.Resolved }}
*Resolved Alerts ({{ .Alerts.Resolved | len }}):*
{{ range .Alerts.Resolved }}
  • *{{ .Labels.alertname }}* - Resolved
    Duration: {{ .StartsAt.Format "15:04" }} - {{ .EndsAt.Format "15:04" }}
{{ end }}
{{ end }}

*Resources:*
• Runbook: {{ .CommonAnnotations.runbook_url | default "N/A" }}
• Dashboard: {{ template "__grafana_url" . }}/d/{{ .GroupLabels.dashboard | default "api-health-v1" }}
• Logs: {{ template "__loki_url" . }}

{{ if .Alerts.Firing }}
*Recommended Actions:*
1. Check service health and error rates
2. Review recent deployments
3. Examine logs for error patterns
4. Escalate if not resolved within 15 minutes
{{ end }}

---
{{ template "__alertmanager_url" . }}
{{ end }}

