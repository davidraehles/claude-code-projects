*Alert Name:* {{ .GroupLabels.alertname }}
*Status:* {{ if .Alerts.Firing }}Firing ({{ .Alerts.Firing | len }}){{ else }}Resolved ({{ .Alerts.Resolved | len }}){{ end }}

{{ if .Alerts.Firing }}
*Firing:*
{{ range .Alerts.Firing }}
  • {{ .Annotations.summary | default .Annotations.description }}
{{ end }}
{{ end }}

{{ if .Alerts.Resolved }}
*Resolved:*
{{ range .Alerts.Resolved }}
  • {{ .Labels.alertname }} - Resolved after {{ sub .EndsAt.Unix .StartsAt.Unix | humanizeDuration }}
{{ end }}
{{ end }}

*Details:*
{{ range .Alerts }}
  • {{ .Annotations.description }}
{{ end }}

*Links:*
• Metrics: {{ template "__grafana_url" . }}
